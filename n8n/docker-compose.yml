# AHL screening: a separate n8n that does not touch any other n8n on this computer.
name: ahl-screening
services:
  n8n:
    image: n8nio/n8n:2.12.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"          # this computer only, not the network
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Run the setup step that creates .env}
      N8N_HOST: localhost
      N8N_EDITOR_BASE_URL: http://localhost:5678
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Africa/Nairobi
      TZ: Africa/Nairobi
      N8N_DIAGNOSTICS_ENABLED: "false"           # no usage data sent out
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RESTRICT_FILE_ACCESS_TO: /home/node/.n8n-files   # no access to this computer's files
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
    volumes:
      - n8n_data:/home/node/.n8n
  helper:                               # reads PDFs, checks answers, fills the template; no AI, no keys
    build:
      context: ..
      dockerfile: service/Dockerfile
    restart: unless-stopped
    environment:
      TZ: Africa/Nairobi
    volumes:
      - ../config:/app/config:ro
      - "${TEMPLATE_FILE:-../../2025.12_Screening Template vF.xlsx}:/app/template/template.xlsx:ro"
      - ../runs:/app/runs
volumes:
  n8n_data:
